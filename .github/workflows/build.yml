# Builds the installer executables for Windows, macOS and Linux (no game data inside: the `package/` folder
# is added by tools/build_package.py on the maintainer's machine, because the translation data is not in git).
name: build-installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux: install Tk for the GUI
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Install PyInstaller
        run: python -m pip install pyinstaller
      - name: Smoke test the script
        run: python installer/installer.py --help
      - name: Build
        run: >
          python -m PyInstaller --onefile --noconsole --name DiscoElysium_UA_installer
          --distpath build/exe --workpath build/work --specpath build installer/installer.py
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          path: build/exe/*
